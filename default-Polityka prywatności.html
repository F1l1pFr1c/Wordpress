<!--
=====================================================================
 NAVBAR + HERO "DEFAULT" (hero_dif) – presne podľa screenshotu (navrhnuté pre šírku 1440px)
 Fonty:  nadpisy Josefin Sans 400, text Poppins 400
 Farby:  #FFF9E6 svetlá, #182010 čierna, #3C482D zelená, #723525 červená

 ASSETS: logo a všetky ikony sú vložené priamo v tomto súbore (base64), nič ďalšie netreba sťahovať.
   logo ← dadad.png, vyhľadávanie ← Vector (2).png, srdiečko ← Frame 2157.png,
   ikona rezervácie ← Shape.png, burger ← Frame 45.png

 <header class="nav"> = navbar (samostatne na všetkých stranách)
 <section class="hero-dif"> = nadpis pod ním (default, wishlist, search-res, regulammin)
=====================================================================
-->

<style>
:root{
  --bs-body-font-family:'Poppins',sans-serif;
  --bs-body-font-weight:400;
  --cream:#FFF9E6;
  --black:#182010;
  --green:#3C482D;
  --red:#723525;
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);font-family:var(--bs-body-font-family);font-weight:var(--bs-body-font-weight);color:var(--black)}

h1,h2,h3,h4,h5,h6,.fancy-font{
  font-family:'Josefin Sans',sans-serif;
  font-weight:400;
  letter-spacing:-0.01em;     /* pôvodné -1% → v CSS sa píše v em */
}

/* ===================== NAVBAR ===================== */
.nav{position:relative;background:var(--green);color:var(--cream);padding:21px 44px 0 60px}
.nav a{color:inherit;text-decoration:none}
.nav__inner{min-height:68px;display:flex;align-items:flex-start;justify-content:space-between;gap:32px}

.nav__left,.nav__right{display:flex;align-items:center;height:34px;margin-top:6px}
.nav__left{gap:31px;justify-self:start}
.nav__right{gap:29px;justify-self:end}

.nav__link,.nav__phone,.nav__btn{
  font:400 10px/1 var(--bs-body-font-family);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;
}
.nav__link{display:inline-flex;align-items:center;gap:7px}
.nav__link:hover,.nav__phone:hover{opacity:.7}

/* OFERTA ▾ + dropdown */
.nav__item{position:relative;height:34px;display:flex;align-items:center}
.nav__caret{width:0;height:0;border-left:3.5px solid transparent;border-right:3.5px solid transparent;border-top:5px solid currentColor}
.nav__sub{
  position:absolute;left:-14px;top:100%;min-width:170px;margin:0;padding:8px 0;list-style:none;
  background:var(--green);border:1px solid rgba(255,249,230,.2);
  opacity:0;visibility:hidden;transform:translateY(4px);transition:opacity .2s,transform .2s,visibility .2s;z-index:20;
}
.nav__sub a{display:block;padding:9px 14px;font:400 10px/1 var(--bs-body-font-family);letter-spacing:.05em;text-transform:uppercase}
.nav__sub a:hover{background:rgba(255,249,230,.08)}
.nav__item:hover .nav__sub,.nav__item:focus-within .nav__sub{opacity:1;visibility:visible;transform:none}

/* logo */
.nav__logo{display:block;position:absolute;top:21px;left:50%;transform:translateX(-50%)}
.nav__logo img{display:block;width:158px;height:auto}

/* ikony */
.nav__icon{display:grid;place-items:center;width:12px;height:34px}
.nav__icon img{display:block;width:12px;height:12px}
.nav__heart{width:34px;height:34px;margin:0 -11px;border-radius:50%}   /* 34px = veľkosť kruhu z Frame 2157 */

  display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 16px;border-radius:999px;
  border:1px solid rgba(255,249,230,.3);background:transparent;color:var(--cream);transition:background .2s,opacity .2s;
}
.nav__btn:hover{background:rgba(255,249,230,.1)}
